<!DOCTYPE html>
<html lang="zh-hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}主播会员视频分发系统 - 管理后台{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans antialiased">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-800 text-white flex flex-col hidden md:flex">
            <div class="h-16 flex items-center justify-center border-b border-gray-700">
                <h1 class="text-xl font-bold"><i class="fas fa-video mr-2"></i>视频分发管理</h1>
            </div>
            <nav class="flex-1 overflow-y-auto py-4">
                <ul class="space-y-1">
                    <li>
                        <a href="{% url 'custom_admin:dashboard' %}" class="flex items-center px-6 py-3 hover:bg-gray-700 transition-colors">
                            <i class="fas fa-tachometer-alt w-6"></i>
                            <span>控制台</span>
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'custom_admin:project_list' %}" class="flex items-center px-6 py-3 hover:bg-gray-700 transition-colors">
                            <i class="fas fa-folder-open w-6"></i>
                            <span>项目管理</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="p-4 border-t border-gray-700">
                <a href="{% url 'custom_admin:logout' %}" class="flex items-center px-4 py-2 text-sm text-gray-300 hover:text-white hover:bg-gray-700 rounded transition-colors">
                    <i class="fas fa-sign-out-alt mr-2"></i> 退出登录
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- Top Header -->
            <header class="h-16 bg-white shadow flex items-center justify-between px-6 z-10">
                <div class="flex items-center">
                    <button class="md:hidden text-gray-500 hover:text-gray-700 focus:outline-none">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h2 class="text-xl font-semibold text-gray-800 ml-4 md:ml-0">{% block header %}控制台{% endblock %}</h2>
                </div>
                <div class="flex items-center">
                    <span class="text-gray-600 mr-4">你好, {{ user.username }}</span>
                </div>
            </header>

            <!-- Content Area -->
            <div class="flex-1 overflow-auto p-6">
                {% if messages %}
                    <div class="mb-4">
                        {% for message in messages %}
                            <div class="p-4 rounded shadow mb-2 
                                {% if message.tags == 'error' %}bg-red-100 text-red-700 border-l-4 border-red-500
                                {% elif message.tags == 'success' %}bg-green-100 text-green-700 border-l-4 border-green-500
                                {% else %}bg-blue-100 text-blue-700 border-l-4 border-blue-500{% endif %}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
                
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</body>
</html>
