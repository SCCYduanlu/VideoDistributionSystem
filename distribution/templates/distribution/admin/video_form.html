{% extends 'distribution/admin/base.html' %}

{% block title %}添加视频 - {{ project.title }}{% endblock %}
{% block header %}
<div class="flex items-center">
    <a href="{% url 'custom_admin:project_detail' project.id %}" class="text-gray-500 hover:text-gray-700 mr-2"><i class="fas fa-arrow-left"></i></a>
    添加视频到项目
</div>
{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow max-w-2xl mx-auto p-6">
    <div class="mb-4">
        <h4 class="text-sm font-medium text-gray-500">当前项目：<span class="text-gray-800">{{ project.title }}</span></h4>
    </div>
    <form id="uploadForm" method="post" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">视频标题 *</label>
            <input type="text" name="title" required class="w-full px-4 py-2 border rounded-md focus:ring-indigo-500 focus:border-indigo-500" placeholder="例如：第一集">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">视频文件 *</label>
            <input type="file" id="videoFile" name="video_file" required accept="video/mp4,video/x-m4v,video/*" class="w-full px-4 py-2 border rounded-md focus:ring-indigo-500 focus:border-indigo-500">
            <p class="text-xs text-gray-500 mt-1">支持mp4等常见视频格式。</p>
        </div>
        
        <!-- Progress Bar (Hidden by default) -->
        <div id="progressContainer" class="hidden">
            <div class="flex justify-between mb-1">
                <span class="text-sm font-medium text-indigo-700" id="progressText">准备上传...</span>
                <span class="text-sm font-medium text-indigo-700" id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5">
                <div id="progressBar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <div class="flex justify-end space-x-3">
            <a href="{% url 'custom_admin:project_detail' project.id %}" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">取消</a>
            <button type="submit" id="submitBtn" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                上传视频
            </button>
        </div>
    </form>
</div>

<script>
    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const form = this;
        const fileInput = document.getElementById('videoFile');
        const titleInput = document.querySelector('input[name="title"]');
        const submitBtn = document.getElementById('submitBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const progressPercent = document.getElementById('progressPercent');
        
        if (fileInput.files.length === 0) return;
        
        const file = fileInput.files[0];
        const title = titleInput.value;
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
        
        // Configuration
        const chunkSize = 20 * 1024 * 1024; // 20MB per chunk
        const totalChunks = Math.ceil(file.size / chunkSize);
        // Generate a unique ID for this file upload to resume later
        const uploadId = `${file.name}-${file.size}-${file.lastModified}`.replace(/[^a-zA-Z0-9-]/g, '');
        
        // UI Setup
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
        submitBtn.innerText = '正在上传 (断点续传)';
        progressContainer.classList.remove('hidden');
        progressBar.classList.remove('bg-red-500', 'bg-green-500');
        progressBar.classList.add('bg-indigo-600');
        
        let uploadedChunks = [];
        
        // 1. Check status from server
        try {
            progressText.textContent = '检查上传进度...';
            const statusResponse = await fetch(`{% url 'custom_admin:video_upload_status' project.id %}?upload_id=${uploadId}`);
            if (statusResponse.ok) {
                const data = await statusResponse.json();
                uploadedChunks = data.uploaded_chunks || [];
            }
        } catch (err) {
            console.error("Failed to check status", err);
        }
        
        // 2. Upload chunks
        let hasError = false;
        
        const updateProgress = (currentChunkLoaded = 0) => {
            const baseLoaded = uploadedChunks.length * chunkSize;
            const currentTotalLoaded = Math.min(baseLoaded + currentChunkLoaded, file.size);
            const percentComplete = (currentTotalLoaded / file.size) * 100;
            
            progressBar.style.width = percentComplete + '%';
            progressPercent.textContent = Math.round(percentComplete) + '%';
            
            const uploadedMB = (currentTotalLoaded / (1024 * 1024)).toFixed(1);
            const totalMB = (file.size / (1024 * 1024)).toFixed(1);
            progressText.textContent = `正在上传... ${uploadedMB}MB / ${totalMB}MB`;
        };
        
        updateProgress();
        
        const uploadChunkWithProgress = (formData) => {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', `{% url 'custom_admin:video_upload_chunk' project.id %}`, true);
                
                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        updateProgress(e.loaded);
                    }
                };
                
                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        resolve(xhr.response);
                    } else {
                        reject(new Error(`Server returned ${xhr.status}`));
                    }
                };
                
                xhr.onerror = () => reject(new Error('Network error'));
                xhr.send(formData);
            });
        };
        
        for (let i = 0; i < totalChunks; i++) {
            if (uploadedChunks.includes(i)) {
                continue; // Skip already uploaded chunk
            }
            
            const start = i * chunkSize;
            const end = Math.min(start + chunkSize, file.size);
            const chunk = file.slice(start, end);
            
            const formData = new FormData();
            formData.append('csrfmiddlewaretoken', csrfToken);
            formData.append('upload_id', uploadId);
            formData.append('chunk_index', i);
            formData.append('file', chunk);
            
            let chunkSuccess = false;
            let retries = 0;
            const maxRetries = 5;
            
            while (!chunkSuccess && retries < maxRetries) {
                try {
                    await uploadChunkWithProgress(formData);
                    chunkSuccess = true;
                    uploadedChunks.push(i);
                    updateProgress(); // ensure it displays exact boundary on success
                } catch (err) {
                    retries++;
                    progressText.textContent = `网络错误，正在重试 (${retries}/${maxRetries})...`;
                    console.error(`Chunk ${i} failed`, err);
                    await new Promise(r => setTimeout(r, 2000)); // wait 2s before retry
                }
            }
            
            if (!chunkSuccess) {
                hasError = true;
                progressText.textContent = '网络错误，上传暂停。请刷新页面或再次点击上传以继续。';
                progressBar.classList.add('bg-red-500');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                submitBtn.innerText = '继续上传';
                break;
            }
        }
        
        // 3. Finalize upload
        if (!hasError && uploadedChunks.length === totalChunks) {
            progressText.textContent = '上传完成，服务器正在合并文件与生成防盗水印，请稍候...';
            progressBar.classList.add('animate-pulse');
            
            const completeData = new FormData();
            completeData.append('csrfmiddlewaretoken', csrfToken);
            completeData.append('upload_id', uploadId);
            completeData.append('filename', file.name);
            completeData.append('title', title);
            completeData.append('total_chunks', totalChunks);
            
            try {
                const completeResponse = await fetch(`{% url 'custom_admin:video_upload_complete' project.id %}`, {
                    method: 'POST',
                    body: completeData
                });
                
                if (completeResponse.ok) {
                    progressText.textContent = '处理成功！即将跳转...';
                    progressBar.classList.remove('animate-pulse');
                    progressBar.classList.add('bg-green-500');
                    window.location.href = "{% url 'custom_admin:project_detail' project.id %}";
                } else {
                    throw new Error('Merge failed');
                }
            } catch (err) {
                progressText.textContent = '文件合并处理失败，请联系管理员。';
                progressBar.classList.remove('animate-pulse');
                progressBar.classList.add('bg-red-500');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                submitBtn.innerText = '重新提交合并';
            }
        }
    });
</script>
{% endblock %}
