{% extends 'distribution/admin/base.html' %}

{% block title %}添加视频 - {{ project.title }}{% endblock %}
{% block header %}
<div class="flex items-center">
    <a href="{% url 'custom_admin:project_detail' project.id %}" class="text-gray-500 hover:text-gray-700 mr-2"><i class="fas fa-arrow-left"></i></a>
    添加视频到项目
</div>
{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow max-w-2xl mx-auto p-6">
    <div class="mb-4">
        <h4 class="text-sm font-medium text-gray-500">当前项目：<span class="text-gray-800">{{ project.title }}</span></h4>
    </div>
    <form id="uploadForm" method="post" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">视频标题 *</label>
            <input type="text" name="title" required class="w-full px-4 py-2 border rounded-md focus:ring-indigo-500 focus:border-indigo-500" placeholder="例如：第一集">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">视频文件 *</label>
            <input type="file" id="videoFile" name="video_file" required accept="video/mp4,video/x-m4v,video/*" class="w-full px-4 py-2 border rounded-md focus:ring-indigo-500 focus:border-indigo-500">
            <p class="text-xs text-gray-500 mt-1">支持mp4等常见视频格式。</p>
        </div>
        
        <!-- Progress Bar (Hidden by default) -->
        <div id="progressContainer" class="hidden">
            <div class="flex justify-between mb-1">
                <span class="text-sm font-medium text-indigo-700" id="progressText">准备上传...</span>
                <span class="text-sm font-medium text-indigo-700" id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5">
                <div id="progressBar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <div class="flex justify-end space-x-3">
            <a href="{% url 'custom_admin:project_detail' project.id %}" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">取消</a>
            <button type="submit" id="submitBtn" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                上传视频
            </button>
        </div>
    </form>
</div>

<script>
    document.getElementById('uploadForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const form = this;
        const fileInput = document.getElementById('videoFile');
        const submitBtn = document.getElementById('submitBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const progressPercent = document.getElementById('progressPercent');
        
        if (fileInput.files.length === 0) return;
        
        // Disable button and show progress
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
        progressContainer.classList.remove('hidden');
        
        const xhr = new XMLHttpRequest();
        const formData = new FormData(form);
        
        xhr.upload.addEventListener('progress', function(e) {
            if (e.lengthComputable) {
                const percentComplete = Math.round((e.loaded / e.total) * 100);
                progressBar.style.width = percentComplete + '%';
                progressPercent.textContent = percentComplete + '%';
                progressText.textContent = `正在上传... ${Math.round(e.loaded / (1024 * 1024))}MB / ${Math.round(e.total / (1024 * 1024))}MB`;
                
                if (percentComplete === 100) {
                    progressText.textContent = '上传完成，服务器处理中...';
                    progressBar.classList.add('animate-pulse');
                }
            }
        });
        
        xhr.addEventListener('load', function() {
            if (xhr.status >= 200 && xhr.status < 300) {
                progressText.textContent = '处理成功！即将跳转...';
                progressBar.classList.remove('animate-pulse');
                progressBar.classList.add('bg-green-500');
                
                // Assuming successful response redirects or sets a message
                // In Django, standard form submission returns a redirect (302) but XHR follows it
                // We'll just reload or redirect to the project page based on response URL
                window.location.href = xhr.responseURL || "{% url 'custom_admin:project_detail' project.id %}";
            } else {
                progressText.textContent = '上传失败，请重试';
                progressBar.classList.remove('animate-pulse');
                progressBar.classList.add('bg-red-500');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });
        
        xhr.addEventListener('error', function() {
            progressText.textContent = '网络错误，上传失败';
            progressBar.classList.remove('animate-pulse');
            progressBar.classList.add('bg-red-500');
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        });
        
        xhr.open('POST', form.action, true);
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.send(formData);
    });
</script>
{% endblock %}
