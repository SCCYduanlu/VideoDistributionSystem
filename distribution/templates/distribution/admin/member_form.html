{% extends 'distribution/admin/base.html' %}

{% block title %}录入会员 - {{ project.title }}{% endblock %}
{% block header %}
<div class="flex items-center">
    <a href="{% url 'custom_admin:project_detail' project.id %}" class="text-gray-500 hover:text-gray-700 mr-2"><i class="fas fa-arrow-left"></i></a>
    录入会员并生成提取码
</div>
{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow max-w-2xl mx-auto p-6">
    <div class="mb-4">
        <h4 class="text-sm font-medium text-gray-500">目标项目：<span class="text-gray-800">{{ project.title }}</span></h4>
    </div>
    <form method="post" class="space-y-6">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">会员QQ号 *</label>
            <input type="text" name="qq" required class="w-full px-4 py-2 border rounded-md focus:ring-indigo-500 focus:border-indigo-500" placeholder="请输入会员QQ号">
            <p class="text-xs text-gray-500 mt-1">系统将通过QQ号唯一识别会员，如果QQ号已存在则会更新其昵称。</p>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">会员昵称 *</label>
            <input type="text" name="nickname" required class="w-full px-4 py-2 border rounded-md focus:ring-indigo-500 focus:border-indigo-500" placeholder="例如：张三">
        </div>
        <div class="flex justify-end space-x-3">
            <a href="{% url 'custom_admin:project_detail' project.id %}" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">取消</a>
            <button type="submit" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                录入并生成提取码
            </button>
        </div>
    </form>
</div>
{% endblock %}
