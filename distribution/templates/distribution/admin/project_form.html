{% extends 'distribution/admin/base.html' %}

{% block title %}新建项目 - 管理后台{% endblock %}
{% block header %}新建项目{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow max-w-2xl mx-auto p-6">
    <form method="post" class="space-y-6">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">项目名称 *</label>
            <input type="text" name="title" required class="w-full px-4 py-2 border rounded-md focus:ring-indigo-500 focus:border-indigo-500" placeholder="例如：2026年6月会员专享视频">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">项目描述 (可选)</label>
            <textarea name="description" rows="4" class="w-full px-4 py-2 border rounded-md focus:ring-indigo-500 focus:border-indigo-500" placeholder="简要描述这个项目的视频内容..."></textarea>
        </div>
        <div class="flex justify-end space-x-3">
            <a href="{% url 'custom_admin:project_list' %}" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">取消</a>
            <button type="submit" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                保存项目
            </button>
        </div>
    </form>
</div>
{% endblock %}
