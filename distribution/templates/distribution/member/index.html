{% extends 'distribution/member/base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden mt-10">
    <div class="px-8 pt-10 pb-8 text-center">
        <div class="mx-auto w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center mb-6 shadow-inner">
            <i class="fas fa-unlock-alt text-3xl text-indigo-600"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">输入提取码</h2>
        <p class="text-gray-500 mb-8 text-sm">请输入主播发放给您的专属提取码以观看本期视频</p>
        
        <form action="{% url 'member:verify_code' %}" method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <input type="text" name="code" required 
                    class="w-full text-center text-xl tracking-widest px-4 py-4 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all uppercase placeholder-gray-300" 
                    placeholder="请输入提取码">
            </div>
            <button type="submit" 
                class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold py-4 px-4 rounded-xl hover:from-indigo-700 hover:to-purple-700 focus:outline-none focus:ring-4 focus:ring-indigo-300 shadow-lg transform transition-transform hover:-translate-y-0.5">
                立即提取
            </button>
        </form>
    </div>
    <div class="bg-gray-50 px-8 py-4 border-t border-gray-100 text-center">
        <p class="text-xs text-gray-500">
            <i class="fas fa-info-circle mr-1"></i> 提取码一人一码，请勿泄露给他人。
        </p>
    </div>
</div>
{% endblock %}
