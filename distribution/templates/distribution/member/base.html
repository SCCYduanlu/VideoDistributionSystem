<!DOCTYPE html>
<html lang="zh-hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}会员专属视频提取{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="font-sans antialiased text-gray-800">
    <nav class="bg-white shadow-sm bg-opacity-90 backdrop-blur-sm fixed w-full z-10 top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fas fa-gem text-yellow-500 text-2xl mr-2"></i>
                    <span class="font-bold text-xl tracking-tight text-gray-900">VIP 专属视频中心</span>
                </div>
                <div class="flex items-center">
                    {% block nav_extra %}{% endblock %}
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-24 pb-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
        {% if messages %}
            <div class="max-w-md mx-auto mb-6">
                {% for message in messages %}
                    <div class="p-4 rounded shadow-sm mb-2 text-center 
                        {% if message.tags == 'error' %}bg-red-100 text-red-700
                        {% elif message.tags == 'success' %}bg-green-100 text-green-700
                        {% else %}bg-blue-100 text-blue-700{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-gray-500 text-sm py-6 mt-auto">
        &copy; 2026 主播会员视频中心. All rights reserved.
    </footer>
</body>
</html>
