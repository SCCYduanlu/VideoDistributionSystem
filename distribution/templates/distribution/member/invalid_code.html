{% extends 'distribution/member/base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden mt-10">
    <div class="px-8 pt-10 pb-8 text-center">
        <div class="mx-auto w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mb-6 shadow-inner">
            <i class="fas fa-times-circle text-4xl text-red-500"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">无效的提取码</h2>
        <p class="text-gray-500 mb-8 text-sm">您输入的提取码不存在或已被主播删除。</p>
        
        <a href="{% url 'member:index' %}" class="block w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-indigo-700 transition-colors shadow hover:shadow-lg">
            返回重新输入
        </a>
    </div>
</div>
{% endblock %}
