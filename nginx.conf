server {
    listen 80;
    client_max_body_size 10G; # 允许大文件上传
    
    # 彻底关闭请求体缓冲，使得分块上传的数据流直接传给 Django，降低 Nginx 内存压力
    proxy_request_buffering off;

    # 媒体文件 (用户上传的视频、缓存、生成的下载文件) 直接由 Nginx 提供服务
    location /media/ {
        alias /app/media/;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        
        # 强制浏览器作为附件下载，避免直接在浏览器中播放或返回 HTML 错误
        types {
            application/octet-stream mp4 m4v;
        }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
    }

    # 静态文件 (CSS/JS) 由 Nginx 提供服务
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
    }

    # 其他动态请求转发给 Django (Gunicorn)
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 增加超时时间，防止网慢或处理耗时导致 504 Gateway Timeout
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }
}
